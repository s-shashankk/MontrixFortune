spring.application.name=MontrixFortune
spring.config.import=optional:file:.env[.properties]

# Database (all values come from environment variables / .env)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/montrix_furniture}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.refresh-secret=${JWT_REFRESH_SECRET}
app.jwt.access-expiration-ms=3600000
app.jwt.refresh-expiration-ms=604800000

# CORS
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173}

# Razorpay (no defaults on purpose: the app must not start without real values)
razorpay.key=${RAZORPAY_KEY}
razorpay.secret=${RAZORPAY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}

# Behind Nginx / a proxy
server.forward-headers-strategy=native
server.error.include-message=never
server.error.include-stacktrace=never

# DevTools only matters when running from the IDE / mvn spring-boot:run
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=false

# Start-up data (see DataSeeder). Defaults are production-safe.
app.seed.demo-users=${APP_SEED_DEMO_USERS:false}
app.seed.catalog=${APP_SEED_CATALOG:true}
app.seed.replace-catalog=${APP_SEED_REPLACE_CATALOG:false}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:Store Admin}
